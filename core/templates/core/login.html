{% extends "core/base.html" %}
{% load static %}
{% block title %}AskShket: вход{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'core/css/forms.css' %}">{% endblock %}
{% block content %}
<div class="auth-box">
          <h1 class="mb-3">Вход</h1>



          <form class="ask-form" action="{% url 'core:login' %}" method="post">
          {% csrf_token %}
            <div class="mb-3">
              <label for="login" class="form-label">Логин</label>
              <input type="text" id="login" name="login" class="form-control" maxlength="30" autocomplete="username">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" id="password" name="password" class="form-control" autocomplete="current-password">
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label" for="remember">Запомнить меня</label>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-3">
              <button type="submit" class="btn btn-success px-4">Войти</button>
              <span>Нет аккаунта? <a href="{% url 'core:signup' %}">Зарегистрироваться</a></span>
            </div>
          </form>
        </div>
{% endblock %}
